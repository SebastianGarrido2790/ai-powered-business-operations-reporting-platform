version: 1

# Structural schemas and canonical mappings for every configured source and
# authoritative entity. SDD 001 owns source identity and connector options; this
# file owns field shapes, formats, timezones, decimal conventions, and mappings.
sources:
  supplier_file:
    supplier:
      source_timestamp: optional
      decimal: { separator: ".", thousands: null }
      timezone: null
      fields:
        supplier_code:
          target: external_record_id
          type: string
          required: true
          max_length: 100
          pattern: "^[A-Za-z0-9][A-Za-z0-9._/-]*$"
        name:
          target: name
          type: string
          required: true
          max_length: 255
        created_at:
          target: source_timestamp
          type: timestamp
          formats:
            - "%Y-%m-%dT%H:%M:%S%z"

  legacy_requisitions:
    requisition:
      source_timestamp: optional
      decimal: { separator: ".", thousands: null }
      timezone: null
      fields:
        requisition_no:
          target: requisition_number
          type: string
          required: true
          max_length: 100
          case: upper
          pattern: "^[A-Za-z0-9][A-Za-z0-9._/-]*$"
        supplier_code:
          target: supplier_code
          type: string
          max_length: 255
          case: upper
          pattern: "^[A-Za-z0-9][A-Za-z0-9._/-]*$"
        requested_at:
          target: source_timestamp
          type: timestamp
          formats:
            - "%Y-%m-%dT%H:%M:%S%z"
            - "%Y-%m-%d %H:%M:%S%z"

  erp_master_data:
    supplier:
      source_timestamp: required
      decimal: { separator: ".", thousands: null }
      timezone: null
      fields:
        id:
          target: external_record_id
          type: string
          required: true
          max_length: 100
          pattern: "^[A-Za-z0-9][A-Za-z0-9._/-]*$"
        name:
          target: name
          type: string
          required: true
          max_length: 255
        country:
          target: country
          type: string
          max_length: 3
          pattern: "^[A-Za-z]{3}$"
        category:
          target: category
          type: string
          max_length: 100

    requisition:
      source_timestamp: required
      decimal: { separator: ".", thousands: null }
      timezone: null
      fields:
        id:
          target: external_record_id
          type: string
          required: true
          max_length: 100
          pattern: "^[A-Za-z0-9][A-Za-z0-9._/-]*$"
        requisition_no:
          target: requisition_number
          type: string
          required: true
          max_length: 100
          case: upper
          pattern: "^[A-Za-z0-9][A-Za-z0-9._/-]*$"
        supplier_code:
          target: supplier_code
          type: string
          max_length: 255
          case: upper
          pattern: "^[A-Za-z0-9][A-Za-z0-9._/-]*$"
        requested_on:
          target: requested_on
          type: date
          formats:
            - "%Y-%m-%d"
        needed_by:
          target: needed_by
          type: date
          formats:
            - "%Y-%m-%d"
        status:
          target: status
          type: enum
          max_length: 32
          enum:
            OPEN: OPEN
            open: OPEN
            APPROVED: APPROVED
            approved: APPROVED
            CONVERTED: CONVERTED
            converted: CONVERTED
            CLOSED: CLOSED
            closed: CLOSED
            CANCELLED: CANCELLED
            cancelled: CANCELLED

    quote:
      source_timestamp: required
      decimal: { separator: ".", thousands: null }
      timezone: null
      fields:
        id:
          target: external_record_id
          type: string
          required: true
          max_length: 100
          pattern: "^[A-Za-z0-9][A-Za-z0-9._/-]*$"
        requisition_no:
          target: requisition_number
          type: string
          max_length: 100
          case: upper
          pattern: "^[A-Za-z0-9][A-Za-z0-9._/-]*$"
        supplier_code:
          target: supplier_code
          type: string
          max_length: 255
          case: upper
          pattern: "^[A-Za-z0-9][A-Za-z0-9._/-]*$"
        amount:
          target: amount
          type: decimal
          currency_field: currency
        currency:
          target: currency
          type: string
        quoted_on:
          target: quoted_on
          type: date
          formats:
            - "%Y-%m-%d"
        valid_until:
          target: valid_until
          type: date
          formats:
            - "%Y-%m-%d"
        lead_time_days:
          target: lead_time_days
          type: integer

    purchase_order:
      source_timestamp: required
      decimal: { separator: ".", thousands: null }
      timezone: null
      fields:
        id:
          target: external_record_id
          type: string
          required: true
          max_length: 100
          pattern: "^[A-Za-z0-9][A-Za-z0-9._/-]*$"
        po_number:
          target: purchase_order_number
          type: string
          required: true
          max_length: 100
          case: upper
          pattern: "^[A-Za-z0-9][A-Za-z0-9._/-]*$"
        supplier_code:
          target: supplier_code
          type: string
          max_length: 255
          case: upper
          pattern: "^[A-Za-z0-9][A-Za-z0-9._/-]*$"
        amount:
          target: total_amount
          type: decimal
          currency_field: currency
        currency:
          target: currency
          type: string
        ordered_on:
          target: ordered_on
          type: date
          formats:
            - "%Y-%m-%d"
        committed_delivery_date:
          target: committed_delivery_date
          type: date
          formats:
            - "%Y-%m-%d"
        status:
          target: status
          type: enum
          max_length: 32
          enum:
            OPEN: OPEN
            open: OPEN
            PARTIALLY_DELIVERED: PARTIALLY_DELIVERED
            partially_delivered: PARTIALLY_DELIVERED
            DELIVERED: DELIVERED
            delivered: DELIVERED
            CLOSED: CLOSED
            closed: CLOSED
            CANCELLED: CANCELLED
            cancelled: CANCELLED

    delivery:
      source_timestamp: required
      decimal: { separator: ".", thousands: null }
      timezone: null
      fields:
        id:
          target: external_record_id
          type: string
          required: true
          max_length: 100
          pattern: "^[A-Za-z0-9][A-Za-z0-9._/-]*$"
        po_number:
          target: purchase_order_number
          type: string
          max_length: 100
          case: upper
          pattern: "^[A-Za-z0-9][A-Za-z0-9._/-]*$"
        delivered_on:
          target: delivered_on
          type: date
          formats:
            - "%Y-%m-%d"
        quantity:
          target: quantity
          type: decimal
          unit_field: unit
        unit:
          target: unit
          type: string
          max_length: 32
