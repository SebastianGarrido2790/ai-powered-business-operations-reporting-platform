# ==============================================================================
# Alembic configuration — BOPF
#
# Governed by:
# - INV-015: migrations are version-controlled and explicitly invoked.
# - M0-D04: single migration history under database/migrations/.
#
# The database URL is injected at runtime from validated application settings
# (src/app/core/config/settings.py). Never hardcode credentials in this file.
# ==============================================================================

[alembic]
script_location = database/migrations
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
