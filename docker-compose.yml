# ==============================================================================
# BOPF Minimal Local Development Environment (M0 Stage 4)
#
# Governed by:
# - M0-D05: Local development service composition (API + PostgreSQL only).
# - ADR-012: Infrastructure expansion by evidence.
# - INV-016: Local synthetic configuration; ports bound to loopback.
# ==============================================================================

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-operations}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-operations}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-local}
      DEBUG: ${DEBUG:-false}
      HOST: "0.0.0.0"
      PORT: "8000"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-operations}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "app.workers.runner"]
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-local}
      DEBUG: ${DEBUG:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-operations}
    depends_on:
      db:
        condition: service_healthy
    # The image healthcheck probes the API port; the worker exposes no HTTP server.
    healthcheck:
      disable: true
    restart: unless-stopped

volumes:
  postgres_data:
